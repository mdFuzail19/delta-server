version = 0.1

# ─── Production ───────────────────────────────────────────────────────────────
[default.deploy.parameters]
stack_name = "delta-app-prod"
resolve_s3 = true
s3_prefix = "delta-app-prod"
region = "ap-south-1"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
disable_rollback = false
# After Phase 2 deploy, replace the empty strings with real CloudFront values:
# parameter_overrides = "ENVIRONMENT=\"prod\" ServicePrefix=\"delta-prod\" TableName=\"prod_delta_releases\" S3BucketName=\"app-ota-release\" CloudFrontIDS=\"XXXXXXXXXX\" DeltaCloudFrontURL=\"https://zzzzzzz.cloudfront.net/\""
parameter_overrides = "ENVIRONMENT=\"prod\" ServicePrefix=\"delta-prod\" TableName=\"prod_delta_releases\" S3BucketName=\"app-ota-release\" CloudFrontIDS=\"\" DeltaCloudFrontURL=\"\""
image_repositories = []

# ─── Staging ──────────────────────────────────────────────────────────────────
[staging.deploy.parameters]
stack_name = "delta-app-staging"
resolve_s3 = true
s3_prefix = "delta-app-staging"
region = "ap-south-1"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
disable_rollback = false
# After Phase 2 deploy, replace the empty strings with real CloudFront values:
# parameter_overrides = "ENVIRONMENT=\"staging\" ServicePrefix=\"delta-staging\" TableName=\"staging_delta_releases\" S3BucketName=\"app-ota-release-staging\" CloudFrontIDS=\"XXXXXXXXXX\" DeltaCloudFrontURL=\"https://zzzzzzz.cloudfront.net/\""
parameter_overrides = "ENVIRONMENT=\"staging\" ServicePrefix=\"delta-staging\" TableName=\"staging_delta_releases\" S3BucketName=\"app-ota-release-staging\" CloudFrontIDS=\"\" DeltaCloudFrontURL=\"\""
image_repositories = []

